<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav id="header-nav">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Fiap-logo-novo.jpg?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original"
                id="logo" alt="">
            <a href="">Página Inicial</a>
            <a href="">Produtos</a>
        </nav>

        <!-- Div é um elemento genérico muito utilizado para delimitar espaços e separar elementos. -->
        <div id="usuario">
            <img src="https://i.pinimg.com/736x/d5/0c/48/d50c4877cdd2f1a16e7c54b073604de9.jpg" alt="" id="foto-perfil">
            <p id="nome-usuario">Hideo Kojima Careca</p>
        </div>
    </header>


    <footer>
        <div id="footer-top">
            <div id="footer-top-left">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7314.242728474247!2d-46.65496142659565!3d-23.56408427879785!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c7dbf9ff57%3A0x4ca8eb5c4f7ecca9!2sFIAP%20-%20Paulista!5e0!3m2!1sen!2sbr!4v1790812206366!5m2!1sen!2sbr"
                    width="600" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
            <div id="footer-top-right">
                <nav>
                    <a href="">Trabalhe conosco</a>
                    <a href="">Institucional</a>
                    <a href="">ESG</a>
                    <a href="">Interacall</a>
                    <a href="">Sobre nóis</a>
                </nav>
            </div>
        </div>
        <div id="footer-bottom">
            <p id="direitos">Todos os direitos reservados</p>
        </div>
    </footer>
</body>

</html>
